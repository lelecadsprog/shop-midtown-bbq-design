<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Midtown BBQ Shop</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- HERO -->
  <section class="hero">
    <h1>LOW & SLOW BBQ IN TOKYO</h1>
    <p>Authentic American Smokehouse Experience</p>
    <div class="buttons">
      <button>View Menu</button>
      <button>Reserve Now</button>
    </div>
  </section>

  <!-- ABOUT -->
  <section class="about">
    <h2>Our Story</h2>
    <p>Serving authentic Texas-style BBQ in the heart of Tokyo.</p>
  </section>

  <!-- MENU -->
  <section class="menu">
    <h2>Featured Dishes</h2>
    <div class="cards">
      <div class="card">Brisket</div>
      <div class="card">Ribs</div>
      <div class="card">Burgers</div>
    </div>
  </section>

</body>
</html>
